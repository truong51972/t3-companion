name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck:extension
      - run: npm run build:extension

  windows-runner-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      # Run the same complete suite as Linux. A bootstrap-only subset hid
      # Windows path handling regressions in the refactored Side Panel tests.
      - run: npm test
      - run: npm run typecheck:extension
      - run: npm run build:extension
